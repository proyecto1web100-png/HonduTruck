<!DOCTYPE html>
<html lang="es-HN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hondu Truck · Propuestas de sitio web</title>
<meta name="description" content="Cinco propuestas de sitio web para Hondu Truck. Use el selector para cambiar entre ellas.">
<meta name="theme-color" content="#1D2125">
<link rel="icon" href="1/logo.png">
<style>
:root{--fondo:#1D2125;--fondo-2:#262B31;--linea:rgba(255,255,255,.16);--suave:#B4BCC4;--rojo:#C8161D}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;background:var(--fondo);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
.bar{flex-shrink:0;position:relative;z-index:2;background:var(--fondo);border-bottom:3px solid var(--rojo);padding:12px 16px 14px;transition:margin-top .28s ease}
.bar.oculto{margin-top:calc(-1 * var(--h,140px))}
@media (prefers-reduced-motion:reduce){.bar{transition:none}}
.bar-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.marca{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;white-space:nowrap}
.marca img{width:42px}
.titulo{font-size:17px;font-weight:700}
.titulo span{color:var(--suave);font-weight:500}
.abrir{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--linea);color:#fff;text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap}
.abrir:hover{border-color:#fff}
.sel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sel button{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:62px;padding:10px 14px;border:2px solid var(--linea);border-radius:10px;background:var(--fondo-2);color:#fff;font:inherit;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.sel button:hover{border-color:rgba(255,255,255,.5)}
.sel button small{font-size:13px;color:var(--suave);font-weight:600}
.sel button strong{font-size:17px;line-height:1.2}
.sel button[aria-pressed="true"]{background:#fff;border-color:#fff;color:var(--fondo)}
.sel button[aria-pressed="true"] small{color:var(--rojo)}
.sel button[aria-pressed="true"]::after{content:"Viendo ahora";position:absolute;right:10px;top:10px;font-size:12px;font-weight:700;color:#fff;background:var(--rojo);padding:2px 8px;border-radius:10px}
.sel button:focus-visible,.abrir:focus-visible{outline:3px solid #F2A900;outline-offset:2px}
iframe{flex:1;display:block;width:100%;min-height:0;border:0;background:#fff}
@media (max-width:1100px){.sel button[aria-pressed="true"]::after{display:none}}
@media (max-width:860px){
  .bar{padding:10px 10px 12px}
  .marca img{width:34px}
  .titulo{font-size:15.5px}
  .titulo span{display:block;font-size:13.5px}
  .sel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -10px;padding:0 10px}
  .sel::-webkit-scrollbar{display:none}
  .sel button{flex:0 0 auto;min-width:148px;min-height:56px;padding:8px 12px;scroll-snap-align:start}
  .sel button strong{font-size:16px}
  .abrir span{display:none}
}
.titulo em{font-style:normal;display:none}
@media (max-width:860px){.titulo em{display:inline}}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-top">
    <div class="marca"><img src="1/logo-blanco.png" alt=""></div>
    <div class="titulo" id="sel-t">Elige una propuesta de diseño <span>Toca una opción para ver ese diseño aquí abajo<em class="m"> (desliza para ver las 5)</em></span></div>
    <a class="abrir" data-abrir href="1/" target="_blank" rel="noopener" title="Abrir esta propuesta en una pestaña nueva"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg><span>Abrir en pestaña nueva</span></a>
  </div>
  <nav class="sel" aria-labelledby="sel-t" data-sel>
    <button type="button" data-p="1"><small>Propuesta 1</small><strong>Clara</strong></button>
    <button type="button" data-p="2"><small>Propuesta 2</small><strong>Noche y cromo</strong></button>
    <button type="button" data-p="3"><small>Propuesta 3</small><strong>Institucional</strong></button>
    <button type="button" data-p="4"><small>Propuesta 4</small><strong>Catálogo técnico</strong></button>
    <button type="button" data-p="5"><small>Propuesta 5</small><strong>Cabina (vidrio)</strong></button>
  </nav>
</header>
<iframe data-frame title="Propuesta de sitio web" src="1/"></iframe>
<script>
(function(){
  var frame=document.querySelector("[data-frame]"), abrir=document.querySelector("[data-abrir]"), btns=document.querySelectorAll("[data-p]");
  function current(){var m=/^#propuesta-([1-5])$/.exec(location.hash);return m?m[1]:"1"}
  function show(n){
    btns.forEach(function(b){var on=b.getAttribute("data-p")===n;b.setAttribute("aria-pressed",String(on));if(on)b.scrollIntoView({block:"nearest",inline:"nearest"})});
    var url=n+"/";
    if(frame.getAttribute("src")!==url) frame.setAttribute("src",url);
    abrir.href=url;
    frame.title="Propuesta "+n+" de sitio web";
  }
  document.querySelector("[data-sel]").addEventListener("click",function(e){
    var b=e.target.closest("[data-p]"); if(!b) return;
    var n=b.getAttribute("data-p");
    if(location.hash!=="#propuesta-"+n) history.replaceState(null,"","#propuesta-"+n);
    show(n);
  });
  window.addEventListener("hashchange",function(){show(current())});

  /* hide the selector while scrolling down inside the proposal, bring it back when scrolling up */
  var bar=document.querySelector(".bar"), oculto=false, last=0;
  function medir(){bar.style.setProperty("--h",bar.offsetHeight+"px")}
  function ocultar(h){if(h===oculto)return;oculto=h;bar.classList.toggle("oculto",h)}
  medir(); window.addEventListener("resize",medir);
  bar.addEventListener("focusin",function(){ocultar(false)});
  frame.addEventListener("load",function(){
    ocultar(false);
    try{
      var w=frame.contentWindow; last=w.scrollY||0;
      w.addEventListener("scroll",function(){
        var y=w.scrollY||0;
        if(y<80) ocultar(false);
        else if(y>last+6) ocultar(true);
        else if(y<last-6) ocultar(false);
        last=y;
      },{passive:true});
    }catch(e){}
  });
  show(current());
})();
</script>
</body>
</html>
